services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/ai_assistant

volumes:
  mongo_data:
